name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  # v2.x dropped the espeak-ng frontend, so Piper voices return silence; 1.12.36 still has it
  SHERPA_VERSION: v1.12.36

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Fetch sherpa-onnx native libs and Kotlin API
        run: |
          curl -fL -o android.tar.bz2 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/${SHERPA_VERSION}/sherpa-onnx-${SHERPA_VERSION}-android-static-link-onnxruntime.tar.bz2"
          mkdir -p extracted && tar xjf android.tar.bz2 -C extracted
          mkdir -p app/src/main/jniLibs
          cp -r extracted/jniLibs/arm64-v8a app/src/main/jniLibs/
          rm -f app/src/main/jniLibs/arm64-v8a/libonnxruntime.so
          ls -la app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/java/com/k2fsa/sherpa/onnx
          curl -fL -o app/src/main/java/com/k2fsa/sherpa/onnx/Tts.kt \
            "https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/${SHERPA_VERSION}/sherpa-onnx/kotlin-api/Tts.kt"

      - name: Install Gradle 8.14.3
        run: |
          curl -fL --retry 5 --retry-delay 3 --connect-timeout 20 --max-time 240 \
            -o gradle.zip https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          unzip -q gradle.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.14.3/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: CloneLocal-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Clone Local APK (latest)
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
